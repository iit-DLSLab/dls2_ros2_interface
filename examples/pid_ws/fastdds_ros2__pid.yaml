types:
    idls:
        - >
            #include <control_signal.idl>

    paths: [ "/opt/integration_service/dls2_msgs" ]

systems:
    dds: 
        type: fastdds
        participant:
            file_path: /opt/integration_service/dls2_ros2_bridge/config/dds_participant_config_signals_server.xml
            profile_name: participant_server_discovery_protocol
    ros2:
        type: ros2

routes:
    dds_to_ros2: { from: dds, to: ros2 }
    ros2_to_dds: { from: ros2, to: dds }

topics:
    pid_dds: {
        type: "dls2_msgs/ControlSignalMsg",
        route: ros2_to_dds,
        remap: {
            dds: { type: ControlSignalMsg, topic: pid },
            ros2: { topic: "dls2/pid" }
        }
    }

    pid_ros2: {
        type: "dls2_msgs/ControlSignalMsg",
        route: dds_to_ros2,
        remap: {
            dds: { type: ControlSignalMsg, topic: pid },
            ros2: { topic: "dls2/pid" }
        }
    }
